name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IS_CI_ENV: '1'
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # etag snapshots are platform-specific; tests regenerate the snapshot for
      # the current platform. Upload it so a changed/missing snapshot (e.g.
      # after a sharp upgrade) can be downloaded and committed to the repo.
      - name: Upload regenerated etag snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-server-etags-${{ runner.os }}-node${{ matrix.node-version }}
          path: test/image-server.etags.*.json
          if-no-files-found: ignore
